<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игровой стол — карта, чарлисты, кубы</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1a1a1a;color:#e0e0e0;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
#toolbar{
  height:56px;background:#242424;border-bottom:1px solid #333;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  z-index:10;flex-shrink:0;overflow-x:auto;position:relative;
}
#toolbar button{
  background:#d4a95a;color:#1a1a1a;border:none;padding:6px 12px;
  border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;white-space:nowrap;
}
#toolbar button:hover{background:#e0b96a}
#toolbar button.secondary{background:#444;color:#e0e0e0}
#toolbar button.secondary:hover{background:#555}
#toolbar input[type=number]{
  width:60px;background:#1a1a1a;color:#e0e0e0;border:1px solid #444;
  padding:5px 8px;border-radius:4px;font-size:13px;text-align:center;
}
#toolbar label{font-size:13px;color:#aaa;white-space:nowrap}

/* ===== ПАЛИТРА ===== */
#color-picker-wrap{position:relative}
#color-current{
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  border:2px solid #fff;box-shadow:0 0 0 2px #333;
  padding:0;background:#e05a5a;transition:transform .1s;
}
#color-current:hover{transform:scale(1.1)}

#palette-popup{
  position:absolute;top:42px;left:0;
  background:#2a2a2a;border:1px solid #444;border-radius:8px;
  padding:10px;z-index:100;width:230px;
  box-shadow:0 8px 30px rgba(0,0,0,.8);
  display:none;
}
#palette-popup.open{display:block}

/* сетка базовых цветов */
.palette-grid{
  display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:10px;
}
.palette-grid .swatch{
  aspect-ratio:1;border-radius:3px;cursor:pointer;
  border:1px solid rgba(0,0,0,.3);padding:0;
  transition:transform .1s;
}
.palette-grid .swatch:hover{transform:scale(1.2);z-index:1;position:relative}

/* слайдер оттенков */
.palette-slider-label{
  display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px;
}
#hue-slider{
  width:100%;height:20px;border-radius:10px;outline:none;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  border:1px solid #444;
}
#hue-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:24px;border-radius:3px;
  background:#fff;border:2px solid #1a1a1a;cursor:pointer;
}
#hue-slider::-moz-range-thumb{
  width:16px;height:24px;border-radius:3px;
  background:#fff;border:2px solid #1a1a1a;cursor:pointer;
}
.hue-preview{
  display:flex;gap:3px;margin-top:8px;height:26px;
}
.hue-preview .swatch{
  flex:1;border-radius:3px;cursor:pointer;border:1px solid rgba(0,0,0,.3);
  transition:transform .1s;
}
.hue-preview .swatch:hover{transform:scaleY(1.2);position:relative;z-index:1}

/* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
#main{display:flex;flex:1;overflow:hidden}
#board{flex:1;position:relative;background:#111;overflow:hidden}
#drop-zone{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#666;font-size:16px;pointer-events:none;text-align:center;padding:20px;
}
#drop-zone.dragover{color:#d4a95a;background:#1a1a1a}
#canvas-wrap{
  position:absolute;top:0;left:0;transform-origin:0 0;cursor:crosshair;
}
#bg-image{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#draw-canvas{
  position:absolute;top:0;left:0;cursor:crosshair;touch-action:none;
}

/* ===== БОКОВАЯ ПАНЕЛЬ ===== */
#sidebar{
  width:340px;background:#1e1e1e;border-left:1px solid #333;
  display:flex;flex-direction:column;flex-shrink:0;
}
#sidebar-header{
  padding:8px 12px;background:#242424;border-bottom:1px solid #333;
  display:flex;justify-content:space-between;align-items:center;
}
#sidebar-header h3{margin:0;color:#d4a95a;font-size:14px}
#sidebar-header button{
  background:#444;color:#e0e0e0;border:none;padding:3px 8px;
  border-radius:4px;cursor:pointer;font-size:11px;
}
#sidebar-header button:hover{background:#555}
#char-list{flex:1;overflow-y:auto;padding:8px}
.char-card{
  background:#242424;border:1px solid #333;border-radius:6px;
  margin-bottom:8px;overflow:hidden;
}
.char-card-header{
  padding:8px 10px;background:#2a2a2a;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.char-card-header:hover{background:#333}
.char-name{font-weight:bold;color:#d4a95a;font-size:13px}
.char-sub{font-size:11px;color:#888}
.char-delete{
  background:#a04040;color:#fff;border:none;border-radius:4px;
  padding:2px 6px;cursor:pointer;font-size:10px;
}
.char-delete:hover{background:#c05050}
.char-body{
  padding:8px 10px;font-size:11px;font-family:monospace;
  white-space:pre-wrap;color:#bbb;border-top:1px solid #333;
  max-height:300px;overflow-y:auto;
}
.char-body b{color:#d4a95a}

/* ===== КУБЫ ===== */
#dice-panel{
  position:fixed;right:356px;bottom:16px;
  background:#242424;border:1px solid #444;border-radius:8px;
  padding:12px;min-width:240px;max-width:320px;max-height:50vh;
  display:flex;flex-direction:column;
  box-shadow:0 4px 20px rgba(0,0,0,.6);z-index:20;
}
#dice-panel h3{margin:0 0 8px;color:#d4a95a;font-size:14px}
#dice-result{
  display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;
  padding:4px 0;flex:1;
}
.die{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:34px;padding:0 8px;
  background:#1a1a1a;border:2px solid #444;border-radius:6px;
  font-weight:bold;font-size:16px;color:#e0e0e0;
}
.die.high{border-color:#5ae05a;color:#5ae05a;background:#1a2a1a}

#hint{
  position:fixed;top:64px;left:12px;background:#242424;
  border:1px solid #333;border-radius:6px;padding:6px 10px;
  font-size:11px;color:#888;z-index:5;max-width:340px;
}
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-map">Загрузить карту</button>
  <input type="file" id="map-input" accept="image/*" style="display:none">
  <button class="secondary" id="btn-clear">Очистить рисунок</button>
  <label>Размер:</label>
  <input type="number" id="brush-size" min="1" max="50" value="4">

  <!-- ПАЛИТРА -->
  <div id="color-picker-wrap">
    <button id="color-current" title="Выбрать цвет"></button>
    <div id="palette-popup">
      <div class="palette-slider-label">
        <span>Оттенок</span>
        <span id="hue-value">0°</span>
      </div>
      <input type="range" id="hue-slider" min="0" max="360" value="0">
      <div class="hue-preview" id="hue-preview"></div>
      <div class="palette-grid" id="palette-grid"></div>
    </div>
  </div>

  <button class="secondary" id="btn-eraser">Ластик</button>
  <span style="flex:1"></span>
  <label>Кубы к6:</label>
  <input type="number" id="dice-count" min="1" max="100" value="1">
  <button id="btn-roll">Бросить</button>
</div>

<div id="main">
  <div id="board">
    <div id="drop-zone">Перетащите сюда карту (PNG/JPG) для игры</div>
    <div id="canvas-wrap">
      <img id="bg-image" alt="">
      <canvas id="draw-canvas"></canvas>
    </div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <h3>Чарлисты игроков</h3>
      <button id="btn-load-char">+ Загрузить JSON</button>
      <input type="file" id="char-input" accept=".json,application/json" style="display:none" multiple>
    </div>
    <div id="char-list"></div>
  </div>
</div>

<div id="hint">Перетащите карту на доску. Чарлисты — кнопкой «+ Загрузить JSON» или перетащите на панель справа.</div>

<div id="dice-panel">
  <h3>Результаты броска</h3>
  <div id="dice-result"><span style="color:#666;font-size:12px">Ещё не бросали</span></div>
</div>

<script>
// ===== ПАЛИТРА =====
let currentColor = '#e05a5a';
let eraserMode = false;

const colorCurrent = document.getElementById('color-current');
const palettePopup = document.getElementById('palette-popup');
const hueSlider = document.getElementById('hue-slider');
const hueValue = document.getElementById('hue-value');
const huePreview = document.getElementById('hue-preview');
const paletteGrid = document.getElementById('palette-grid');

function setColor(c){
  currentColor = c;
  colorCurrent.style.background = c;
  eraserMode = false;
  colorCurrent.style.borderColor = '#fff';
}

// базовые 20 цветов (2 ряда по 10)
const BASE_COLORS = [
  '#000000','#3a3a3a','#7a7a7a','#b0b0b0','#ffffff','#e05a5a','#e0a05a','#e0d45a','#a0e05a','#5ae05a',
  '#5ae0a0','#5ae0e0','#5a9ae0','#5a5ae0','#a05ae0','#e05ae0','#e05aa0','#8b4513','#d2691e','#ff69b4'
];
BASE_COLORS.forEach(c=>{
  const sw = document.createElement('button');
  sw.className = 'swatch';
  sw.style.background = c;
  sw.title = c;
  sw.onclick = ()=>{ setColor(c); palettePopup.classList.remove('open'); };
  paletteGrid.appendChild(sw);
});

// генерация оттенков для слайдера
function updateHuePreview(hue){
  huePreview.innerHTML = '';
  // 11 оттенков: от тёмного к светлому
  const steps = 11;
  for(let i=0;i<steps;i++){
    const lightness = 15 + (i * 7); // 15% .. 85%
    const c = `hsl(${hue}, 70%, ${lightness}%)`;
    const sw = document.createElement('button');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.title = c;
    sw.onclick = ()=>{ setColor(c); palettePopup.classList.remove('open'); };
    huePreview.appendChild(sw);
  }
}

hueSlider.oninput = ()=>{
  const h = parseInt(hueSlider.value);
  hueValue.textContent = h + '°';
  updateHuePreview(h);
};
updateHuePreview(0);

// открытие/закрытие палитры
colorCurrent.onclick = e=>{
  e.stopPropagation();
  palettePopup.classList.toggle('open');
};
document.addEventListener('click', e=>{
  if(!e.target.closest('#color-picker-wrap')) palettePopup.classList.remove('open');
});

// инициализация цвета
setColor(currentColor);

// ===== КУБЫ =====
const diceBtn = document.getElementById('btn-roll');
const diceResult = document.getElementById('dice-result');
diceBtn.onclick = ()=>{
  const n = Math.max(1, Math.min(100, parseInt(document.getElementById('dice-count').value)||1));
  const rolls = [];
  for(let i=0;i<n;i++) rolls.push(1+Math.floor(Math.random()*6));
  diceResult.innerHTML = rolls.map(r=>`<span class="die ${r>=5?'high':''}">${r}</span>`).join('');
};

// ===== ДОСКА (карта) =====
const board = document.getElementById('board');
const dropZone = document.getElementById('drop-zone');
const wrap = document.getElementById('canvas-wrap');
const bgImg = document.getElementById('bg-image');
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');
const brushInput = document.getElementById('brush-size');
const mapInput = document.getElementById('map-input');
document.getElementById('btn-map').onclick = ()=>mapInput.click();

let history = [];
let isDrawing = false;
let lastX = 0, lastY = 0;

function fitWrap(){
  const bw = board.clientWidth, bh = board.clientHeight;
  const iw = canvas.width || 1;
  const ih = canvas.height || 1;
  const scale = Math.min(bw/iw, bh/ih, 1);
  const dw = iw*scale, dh = ih*scale;
  wrap.style.width = dw+'px';
  wrap.style.height = dh+'px';
  wrap.style.left = ((bw-dw)/2)+'px';
  wrap.style.top = ((bh-dh)/2)+'px';
  bgImg.style.width = dw+'px';
  bgImg.style.height = dh+'px';
  canvas.style.width = dw+'px';
  canvas.style.height = dh+'px';
}

function resetCanvas(w, h){
  canvas.width = w;
  canvas.height = h;
  ctx.clearRect(0,0,w,h);
  history = [];
}

function loadMap(src){
  const im = new Image();
  im.onload = ()=>{
    bgImg.src = src;
    bgImg.onload = ()=>{
      dropZone.style.display = 'none';
      resetCanvas(bgImg.naturalWidth, bgImg.naturalHeight);
      fitWrap();
    };
  };
  im.onerror = ()=>alert('Не удалось загрузить карту');
  im.src = src;
}

function handleMapFile(f){
  if(!f.type.startsWith('image/')){alert('Это не картинка');return;}
  const reader = new FileReader();
  reader.onload = ev=>loadMap(ev.target.result);
  reader.readAsDataURL(f);
}

mapInput.onchange = e=>{
  const f = e.target.files[0];
  if(f) handleMapFile(f);
};

['dragenter','dragover'].forEach(ev=>{
  board.addEventListener(ev, e=>{e.preventDefault();dropZone.classList.add('dragover');});
});
['dragleave','drop'].forEach(ev=>{
  board.addEventListener(ev, e=>{e.preventDefault();dropZone.classList.remove('dragover');});
});
board.addEventListener('drop', e=>{
  const f = e.dataTransfer.files[0];
  if(!f) return;
  if(f.type.startsWith('image/')) handleMapFile(f);
  else if(f.name.endsWith('.json')) addCharFromFile(f);
});

// ===== РИСОВАНИЕ =====
function getPos(e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}

function saveHistory(){
  if(history.length >= 30) history.shift();
  history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
}

function brushSize(){
  return Math.max(1, Math.min(50, parseInt(brushInput.value)||4));
}

canvas.addEventListener('pointerdown', e=>{
  if(e.button !== 0) return;
  if(canvas.width === 0) return;
  isDrawing = true;
  canvas.setPointerCapture(e.pointerId);
  saveHistory();
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  ctx.beginPath();
  ctx.arc(p.x, p.y, brushSize()/2, 0, Math.PI*2);
  if(eraserMode){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = currentColor;
  }
  ctx.fill();
});

canvas.addEventListener('pointermove', e=>{
  if(!isDrawing) return;
  const p = getPos(e);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = brushSize();
  if(eraserMode){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
  }
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x; lastY = p.y;
});

['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  canvas.addEventListener(ev, ()=>{isDrawing=false;});
});

document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(history.length) ctx.putImageData(history.pop(),0,0);
  }
});

document.getElementById('btn-clear').onclick = ()=>{
  if(!confirm('Очистить рисунок?')) return;
  saveHistory();
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

document.getElementById('btn-eraser').onclick = ()=>{
  eraserMode = !eraserMode;
  colorCurrent.style.borderColor = eraserMode ? '#d4a95a' : '#fff';
  if(!eraserMode) setColor(currentColor);
};

window.addEventListener('resize', ()=>{ if(canvas.width) fitWrap(); });

// ===== ЧАРЛИСТЫ =====
const ATTRS={SIL:'СИЛ',TEL:'ТЕЛ',LVK:'ЛВК',INT:'ИНТ',MDR:'МДР',HAR:'ХАР'};
const SKILLS={
  blades:'Клинки',blunt:'Дробящее',axes:'Топоры',unarmed:'Безоружный бой',
  staves:'Посохи',thrown:'Метательное',polearms:'Древковое',bows:'Луки',
  crossbows:'Арбалеты',dualwield:'Парное оружие',evocation:'Воплощение',
  necromancy:'Некромантия',transmutation:'Трансмутация',illusion:'Иллюзия',
  enchantment:'Очарование',divination:'Прорицание',abjuration:'Ограждение',
  conjuration:'Созидание',defense:'Защита',persuasion:'Убеждение',
  survival:'Выживание',perception:'Внимательность',lore:'Начитанность',
  stealth:'Скрытность',sleight:'Сноровка',improvisation:'Импровизация',qi:'Ци'
};
const SKILL_ATTR={
  blades:['SIL','LVK'],blunt:'SIL',axes:'SIL',unarmed:['SIL','LVK'],staves:'LVK',
  thrown:'LVK',polearms:'LVK',bows:'LVK',crossbows:'LVK',dualwield:['SIL','LVK'],
  evocation:'INT',necromancy:'MDR',transmutation:'INT',illusion:'HAR',
  enchantment:'HAR',divination:'MDR',abjuration:'MDR',conjuration:'MDR',
  defense:null,persuasion:'HAR',survival:'MDR',perception:'MDR',lore:'INT',
  stealth:'LVK',sleight:'LVK',improvisation:'SIL',qi:'MDR'
};
const CLASSES_NAMES={
  alchemist:'Алхимик',bard:'Бард',barbarian:'Варвар',fighter:'Воин',wizard:'Волшебник',
  druid:'Друид',cleric:'Жрец',monk:'Монах',paladin:'Паладин',ranger:'Следопыт',
  sorcerer:'Чародей',rogue:'Плут',magus:'Магос'
};
const RACE_NAMES={
  human:'Человек',dwarf:'Дварф',gnome:'Гном',elf:'Эльф',halfling:'Полурослик',
  halfelf:'Полуэльф',halforc:'Полуорк',aasimar:'Аасимар',tiefling:'Тифлинг'
};
const GENDER_NAMES={male:'Мужской',female:'Женский','':'—'};

function getAttrValue(a, attrs){
  if(!a) return 0;
  if(Array.isArray(a)) return Math.max(...a.map(x=>attrs[x]||1));
  return attrs[a]||1;
}
function getAttrLabel(a){
  if(!a) return '—';
  if(Array.isArray(a)) return a.map(x=>ATTRS[x]).join('/');
  return ATTRS[a];
}

function buildCharHtml(data){
  const lines = [];
  lines.push(`<b>Имя:</b> ${escapeHtml(data.name||'—')}`);
  lines.push(`<b>Пол:</b> ${GENDER_NAMES[data.gender]||'—'}`);
  const race = RACE_NAMES[data.race]||data.race||'—';
  lines.push(`<b>Раса:</b> ${escapeHtml(race)}${data.subrace?' ('+escapeHtml(data.subrace)+')':''}`);
  lines.push(`<b>Класс:</b> ${CLASSES_NAMES[data.class]||data.class||'—'}`);
  if(data.priority) lines.push(`<b>Приоритет:</b> ${data.priority}`);
  lines.push('');

  lines.push('<b>Атрибуты:</b>');
  const attrs = data.attrs||{};
  const attrParts = [];
  for(const k in ATTRS) attrParts.push(`${ATTRS[k]}:${attrs[k]||1}`);
  lines.push('  '+attrParts.join(' '));
  lines.push('');

  const tel = attrs.TEL||1;
  lines.push(`<b>Здоровье:</b> ${10+tel*2}`);
  lines.push('');

  lines.push('<b>Навыки:</b>');
  const skills = data.skills||{};
  const ids = Object.keys(skills).filter(id=>skills[id]>0);
  if(!ids.length) lines.push('  —');
  else ids.sort().forEach(id=>{
    const v = skills[id];
    const a = getAttrValue(SKILL_ATTR[id], attrs);
    lines.push(`  ${SKILLS[id]||id} (${getAttrLabel(SKILL_ATTR[id])}): ${v} → ${v+a}d6`);
  });
  lines.push('');

  lines.push('<b>Заклинания:</b>');
  const spells = data.spells||{};
  const spellIds = Object.keys(spells).filter(id=>spells[id]);
  if(!spellIds.length) lines.push('  —');
  else spellIds.forEach(id=>lines.push(`  • ${id}`));
  lines.push('');

  lines.push('<b>Снаряжение:</b>');
  const cart = data.cart||[];
  if(!cart.length) lines.push('  —');
  else cart.forEach(c=>{
    let s = `  • ${escapeHtml(c.name||c.id)}`;
    if(c.sharp) s += ` [+${c.sharp} заточка]`;
    if(c.reinf) s += ` [+${c.reinf} укрепление]`;
    lines.push(s);
  });

  if(data.notepad){
    const tabs={bio:'Предыстория',notes:'Заметки',quests:'Квесты'};
    for(const t in tabs){
      if(data.notepad[t] && data.notepad[t].trim()){
        lines.push('');
        lines.push(`<b>${tabs[t]}:</b>`);
        lines.push(escapeHtml(data.notepad[t].trim()));
      }
    }
  }
  return lines.join('\n');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let charCounter = 0;
function addChar(data){
  charCounter++;
  const id = 'char_'+Date.now()+'_'+charCounter;
  const list = document.getElementById('char-list');

  const card = document.createElement('div');
  card.className = 'char-card';
  card.dataset.id = id;

  const header = document.createElement('div');
  header.className = 'char-card-header';
  const name = data.name || 'Безымянный';
  const race = RACE_NAMES[data.race]||'';
  const cls = CLASSES_NAMES[data.class]||'';
  header.innerHTML = `
    <div>
      <div class="char-name">${escapeHtml(name)}</div>
      <div class="char-sub">${escapeHtml(race)} · ${escapeHtml(cls)}</div>
    </div>
    <button class="char-delete" title="Удалить">×</button>
  `;

  const body = document.createElement('div');
  body.className = 'char-body';
  body.style.display = 'none';
  body.innerHTML = buildCharHtml(data);

  header.querySelector('.char-delete').onclick = e=>{
    e.stopPropagation();
    if(confirm('Удалить чарлист '+name+'?')) card.remove();
  };
  header.onclick = ()=>{
    body.style.display = body.style.display==='none' ? 'block' : 'none';
  };

  card.appendChild(header);
  card.appendChild(body);
  list.appendChild(card);
}

function addCharFromFile(f){
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || typeof data !== 'object') throw new Error('не объект');
      addChar(data);
    }catch(e){
      alert('Ошибка чтения JSON: '+e.message);
    }
  };
  reader.readAsText(f);
}

const charInput = document.getElementById('char-input');
document.getElementById('btn-load-char').onclick = ()=>charInput.click();
charInput.onchange = e=>{
  for(const f of e.target.files) addCharFromFile(f);
  charInput.value = '';
};

const sidebar = document.getElementById('sidebar');
['dragenter','dragover'].forEach(ev=>{
  sidebar.addEventListener(ev, e=>{e.preventDefault();e.stopPropagation();});
});
sidebar.addEventListener('drop', e=>{
  e.preventDefault();
  e.stopPropagation();
  for(const f of e.dataTransfer.files){
    if(f.name.endsWith('.json') || f.type==='application/json') addCharFromFile(f);
  }
});

document.addEventListener('paste', e=>{
  for(const it of e.clipboardData.items){
    if(it.type.startsWith('image/')){
      const f = it.getAsFile();
      handleMapFile(f);
      break;
    }
  }
});
</script>
